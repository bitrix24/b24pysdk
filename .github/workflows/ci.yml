name: CI

on:
  push:
    branches: [ main, dev-*, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]

    env:
      B24_DOMAIN: ${{ secrets.B24_DOMAIN }}
      B24_WEBHOOK: ${{ secrets.B24_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,test]

      - name: Lint (ruff)
        run: |
          ruff --version
          ruff check .

      - name: Run unit tests
        run: |
          pytest tests -m "unit"

  docker-ci:
    runs-on: ubuntu-latest

    env:
      B24_DOMAIN: ${{ secrets.B24_DOMAIN }}
      B24_WEBHOOK: ${{ secrets.B24_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CI Docker image
        run: |
          docker build \
            -f docker/ci.Dockerfile \
            --build-arg PYTHON_VERSION=3.14 \
            -t b24pysdk-ci .

      # Always run a minimal webhook smoke test to catch core token/request regressions.
      - name: Run scope profile tests in Docker
        run: |
          docker run --rm \
            -e B24_DOMAIN=$B24_DOMAIN \
            -e B24_WEBHOOK=$B24_WEBHOOK \
            b24pysdk-ci \
            pytest -m "profile"

      - name: Run unit tests in Docker
        run: |
          docker run --rm \
            -e B24_DOMAIN=$B24_DOMAIN \
            -e B24_WEBHOOK=$B24_WEBHOOK \
            b24pysdk-ci \
            pytest -m "unit"
